<div th:fragment="selectTournament" class="dropdown-center">
    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Selecciona un torneo
    </button>
    <ul class="dropdown-menu">
        <li th:each="tournament : ${tournaments}"><a class="dropdown-item" th:href="@{/admin/tournament/{tournamentId}(tournamentId=${tournament.id})}" th:text="${tournament.name}"></a></li>
    </ul>
</div>
