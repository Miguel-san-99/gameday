<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/img/favicon.png}" rel="icon">
    <!-- Main CSS File -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/index}">
                <img th:src="@{/img/logo.png}" alt="Logo" width="100" height=100%
                    class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/index}">Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Torneos
                        </a>
                        <ul class="dropdown-menu">
                            <div th:each="competition : ${competitions}">
                                <li><h6 class="dropdown-header" th:text="${competition.name}"></h6></li>
                                <li th:each="tournament : ${competition.tournaments}">
                                    <a class="dropdown-item"
                                       th:href="@{/tournament/{tournamentId}(tournamentId=${tournament.id})}"
                                       th:text="${tournament.name}">
                                    </a>
                                </li>
                            </div>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/about-us}">Quienes somos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<footer id="footer" class="footer dark-background" th:fragment="footer">
    <div class="copyright text-center">
        <div
            class="container d-flex flex-column flex-lg-row justify-content-center justify-content-lg-between align-items-center">

            <div class="d-flex flex-column align-items-center align-items-lg-start">
                <div>
                    © Copyright <strong><span>2026</span></strong>. All Rights Reserved
                </div>
                <div class="credits">
                    Designed by Miguel Sánchez
                </div>
                <div>
                    <strong>Ubicación: </strong>
                    Av. Paseo La Toscana 1001-B, Valle Real, 45019 Zapopan, Jal.
                </div>
            </div>

            <div class="social-links order-first order-lg-last mb-3 mb-lg-0">
                <a href="https://www.facebook.com/profile.php?id=100090147656883"><i class="bi bi-facebook"></i></a>
                <a href="https://www.instagram.com/derbiasportclub/"><i class="bi bi-instagram"></i></a>
                <!-- <a href=""><i class="bi bi-twitter-x"></i></a> -->
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</footer>

</html>
